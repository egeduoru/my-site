<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ЕГЭ Тренажёр</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #111827;

            /* Сине-белый фон с мягким эффектом дыма / пара */
        background:
            radial-gradient(ellipse 38% 20% at 12% 18%, rgba(255,255,255,0.92) 0%, rgba(225,239,250,0.52) 42%, transparent 78%),
            radial-gradient(ellipse 46% 24% at 84% 14%, rgba(255,255,255,0.86) 0%, rgba(205,226,242,0.48) 44%, transparent 80%),
            radial-gradient(ellipse 52% 28% at 52% 48%, rgba(210,231,245,0.58) 0%, rgba(160,199,225,0.24) 48%, transparent 80%),
            radial-gradient(ellipse 42% 22% at 10% 74%, rgba(255,255,255,0.82) 0%, rgba(202,226,242,0.42) 46%, transparent 80%),
            radial-gradient(ellipse 50% 28% at 90% 78%, rgba(245,251,255,0.78) 0%, rgba(155,199,226,0.30) 46%, transparent 82%),
            linear-gradient(135deg, #c5e1f5 0%, #f8fcff 28%, #b9d7ea 52%, #f4faff 72%, #bddbec 100%);
        background-size: 180% 180%;
        animation: smokeSky 28s ease-in-out infinite;
    }

    @keyframes smokeSky {
        0% { background-position: 0% 15%; }
        25% { background-position: 42% 0%; }
        50% { background-position: 100% 52%; }
        75% { background-position: 55% 100%; }
        100% { background-position: 0% 15%; }
    }

    /* Мягкие полупрозрачные клубы дыма */
    body::before,
    body::after {
        content: "";
        position: fixed;
        pointer-events: none;
        z-index: 0;
        width: min(105vw, 720px);
        height: min(58vw, 380px);
        border-radius: 50%;
        filter: blur(38px);
        opacity: 0.78;
        background:
            radial-gradient(ellipse at 10% 62%, rgba(255,255,255,0.86) 0 12%, transparent 34%),
            radial-gradient(ellipse at 27% 38%, rgba(247,252,255,0.72) 0 18%, transparent 40%),
            radial-gradient(ellipse at 46% 57%, rgba(225,239,248,0.82) 0 16%, transparent 39%),
            radial-gradient(ellipse at 65% 35%, rgba(255,255,255,0.68) 0 15%, transparent 38%),
            radial-gradient(ellipse at 84% 60%, rgba(211,231,242,0.70) 0 15%, transparent 37%);
    }

    body::before {
        top: 4%;
        left: -28%;
        animation: smokeDriftA 20s ease-in-out infinite;
    }

    body::after {
        right: -30%;
        bottom: 3%;
        opacity: 0.64;
        filter: blur(48px);
        mix-blend-mode: screen;
        animation: smokeDriftB 25s ease-in-out infinite;
    }

    @keyframes smokeDriftA {
        0%, 100% {
            transform: translate3d(-30px, 12px, 0) scale(0.96) rotate(-2deg);
            opacity: 0.68;
        }
        50% {
            transform: translate3d(55px, -22px, 0) scale(1.10) rotate(3deg);
            opacity: 0.86;
        }
    }

    @keyframes smokeDriftB {
        0%, 100% {
            transform: translate3d(34px, -8px, 0) scale(1.05) rotate(2deg);
            opacity: 0.54;
        }
        50% {
            transform: translate3d(-48px, 24px, 0) scale(0.92) rotate(-4deg);
            opacity: 0.76;
        }
    }

        /* =========================
           ОБЩИЙ ЭКРАН
        ========================= */

        .screen {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            padding:
                calc(env(safe-area-inset-top) + 20px)
                18px
                calc(env(safe-area-inset-bottom) + 20px);

            overflow: hidden;

            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(22px, 0, 0) scale(0.985);
            filter: blur(7px);

            transition:
                opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 620ms cubic-bezier(0.22, 1, 0.36, 1),
                filter 420ms cubic-bezier(0.22, 1, 0.36, 1);

            will-change: opacity, transform, filter;
        }

        .screen.active {
            visibility: visible;
            pointer-events: auto;
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0);
            z-index: 2;
        }

        /*
           Переходы в стиле iOS / Liquid Glass:
           новый экран мягко приходит с нужной стороны,
           а старый слегка отходит назад и теряет резкость.
        */
        .screen.transition-forward {
            transform: translate3d(28px, 0, 0) scale(0.982);
        }

        .screen.transition-back {
            transform: translate3d(28px, 0, 0) scale(0.982);
        }

        .screen.leaving-forward {
            opacity: 0;
            transform: translate3d(-18px, 0, 0) scale(0.985);
            filter: blur(5px);
            pointer-events: none;
            z-index: 1;
        }

        .screen.leaving-back {
            opacity: 0;
            transform: translate3d(-18px, 0, 0) scale(0.985);
            filter: blur(5px);
            pointer-events: none;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .screen {
                transition: opacity 180ms ease;
                transform: none !important;
                filter: none !important;
            }
        }


        /* =========================
           HOME
        ========================= */

        #homeScreen {
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .home-content {
            width: min(90vw, 420px);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .home-title {
            font-size: clamp(60px, 18vw, 92px);
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        /* Серия: первый концепт огня — компактное живое пламя над буквой U */
        .streak-u {
            position: relative;
            display: inline-block;
        }

        .streak-flame {
            position: absolute;
            left: 50%;
            top: -40px;
            width: 50px;
            height: 60px;
            transform: translateX(-50%) scale(.9);
            transform-origin: 50% 100%;
            opacity: .16;
            color: rgba(37, 99, 235, .28);
            pointer-events: auto;
            cursor: pointer;
            z-index: 2;
            transition: opacity .35s ease, color .35s ease, filter .35s ease, transform .35s ease;
        }

        .streak-flame::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 77%, rgba(255,255,255,.98) 0 12%, transparent 13%),
                linear-gradient(145deg, rgba(255,255,255,.28), transparent 34%),
                currentColor;
            clip-path: polygon(
                51% 0%, 62% 15%, 61% 27%, 78% 18%, 76% 37%,
                94% 49%, 86% 70%, 72% 88%, 53% 100%, 30% 96%,
                12% 80%, 6% 60%, 19% 47%, 27% 31%, 42% 38%, 40% 20%
            );
            filter: saturate(1.15);
        }

        .streak-flame::after {
            content: "";
            position: absolute;
            left: 12px;
            bottom: 10px;
            width: 26px;
            height: 38px;
            background:
                radial-gradient(ellipse at 50% 82%, #ffffff 0 18%, rgba(255,255,255,.86) 19% 35%, transparent 36%),
                linear-gradient(165deg, rgba(255,255,255,.95), rgba(255,255,255,.38));
            clip-path: polygon(50% 0%, 71% 27%, 66% 43%, 88% 58%, 77% 83%, 57% 100%, 30% 94%, 12% 73%, 28% 53%, 39% 38%);
            opacity: .86;
            filter: blur(.15px);
        }

        .streak-flame.is-blue {
            opacity: 1;
            color: #2563eb;
            filter: drop-shadow(0 3px 5px rgba(37, 99, 235, .22));
            transform: translateX(-50%) scale(1);
            animation: streakFlameFlicker 1.15s ease-in-out infinite;
        }

        .streak-flame.is-purple {
            opacity: 1;
            color: #8b5cf6;
            filter: drop-shadow(0 3px 6px rgba(139, 92, 246, .28));
            transform: translateX(-50%) scale(1.02);
            animation: streakFlameFlicker 1.05s ease-in-out infinite;
        }

        @keyframes streakFlameFlicker {
            0%, 100% { transform: translateX(-50%) rotate(-2deg) scale(1); }
            22% { transform: translateX(-50%) rotate(2deg) scale(1.035, .97); }
            48% { transform: translateX(-50%) rotate(-1deg) scale(.975, 1.045); }
            72% { transform: translateX(-50%) rotate(3deg) scale(1.025, .985); }
        }

        @media (prefers-reduced-motion: reduce) {
            .streak-flame.is-blue,
            .streak-flame.is-purple {
                animation: none;
            }
        }

        /* Окно серии: раскрывается мягко из центра экрана */
        .streak-modal {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(235, 244, 250, .16);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 260ms ease, visibility 260ms ease;
        }

        .streak-modal-card {
            width: min(300px, 82vw);
            min-height: 180px;
            padding: 28px 24px 24px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 30px;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(31, 41, 55, .18);
            text-align: center;
            transform: scale(.62);
            filter: blur(7px);
            transition: transform 430ms cubic-bezier(.22,1,.36,1), filter 360ms ease;
        }

        .streak-modal.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .streak-modal.is-open .streak-modal-card {
            transform: scale(1);
            filter: blur(0);
        }

        .streak-modal-label {
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .1px;
            color: rgba(17,24,39,.58);
        }

        .streak-modal-number {
            font-size: 58px;
            line-height: .95;
            font-weight: 800;
            letter-spacing: -2.5px;
            color: rgba(17,24,39,.92);
        }

        .streak-modal-days {
            margin-top: 7px;
            font-size: 17px;
            font-weight: 700;
            color: rgba(17,24,39,.78);
        }

        .streak-modal-hint {
            margin-top: 17px;
            font-size: 12px;
            color: rgba(17,24,39,.45);
        }

        @media (prefers-reduced-motion: reduce) {
            .streak-modal,
            .streak-modal-card {
                transition: none;
            }
        }

        .home-subtitle {
            font-size: 16px;
            line-height: 1.45;

            max-width: 330px;

            color: rgba(17, 24, 39, 0.65);
        }


        /* =========================
           GLASS BUTTON
        ========================= */

        .glass-button {
            border: 1px solid rgba(255, 255, 255, 0.8);

            background: rgba(255, 255, 255, 0.48);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 12px 35px rgba(30, 100, 200, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);

            color: #111827;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .glass-button:active {
            transform: scale(0.96);

            background: rgba(255, 255, 255, 0.68);

            box-shadow:
                0 5px 18px rgba(30, 100, 200, 0.1),
                inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        .start-button {
            width: min(86vw, 350px);
            min-height: 64px;

            padding: 15px 25px;

            border-radius: 22px;

            font-size: 18px;
            font-weight: 700;
        }


        /* =========================
           TOP BACK BUTTON
        ========================= */

        .back-button {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            left: 16px;

            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
            font-weight: 400;

            z-index: 20;
        }

        .swipe-toggle-button {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            right: 16px;

            width: 42px;
            height: 42px;

            padding: 0;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 20;
        }

        .swipe-toggle-icon {
            width: 25px;
            height: 25px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2.15;
            stroke-linecap: round;
            stroke-linejoin: round;

            opacity: 0.92;
            transition:
                transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.2s ease;
        }

        .swipe-toggle-button.is-enabled .swipe-toggle-icon {
            color: #22c55e;
            filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.45));
        }

        .swipe-toggle-button.is-enabled .swipe-toggle-icon {
            transform: rotate(18deg) scale(1.04);
        }

        /* =========================
           TOPICS
        ========================= */

        #topicsScreen {
            align-items: center;
        }

        .topics-title {
            margin-top: 60px;
            margin-bottom: 25px;

            font-size: 28px;
            font-weight: 800;
        }

        .topics-list {
            width: min(92vw, 430px);
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 4px 3px 18px;
            scrollbar-width: thin;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .topic-button {
            position: relative;
            flex-shrink: 0;

            width: 100%;
            min-height: 65px;

            padding: 12px 17px;

            border-radius: 19px;

            display: flex;
            align-items: center;

            text-align: left;

            font-size: 16px;
            font-weight: 650;

            /* В обычном состоянии активная тема без синего свечения. */
            border-color: rgba(255, 255, 255, .78);
            box-shadow:
                0 10px 26px rgba(30, 100, 200, .07),
                inset 0 1px 2px rgba(255, 255, 255, .95);
        }

        .topic-button.disabled {
            opacity: 0.42;
            cursor: default;
            border-color: rgba(255,255,255,.8);
            box-shadow:
                0 12px 35px rgba(30, 100, 200, 0.12),
                inset 0 1px 2px rgba(255,255,255,.95);
        }

        /* Плавное поднятие темы при наведении */
        @media (hover: hover) and (pointer: fine) {
            .topic-button:not(.disabled) {
                transition:
                    transform 180ms cubic-bezier(.22, 1, .36, 1),
                    border-color 180ms ease,
                    box-shadow 180ms ease,
                    background 180ms ease;
            }

            .topic-button:not(.disabled):hover {
                transform: translateY(-3px);
                border-color: rgba(96, 196, 255, .9);
                box-shadow:
                    0 0 0 1px rgba(96, 196, 255, .35),
                    0 0 14px rgba(96, 196, 255, .55),
                    0 0 30px rgba(96, 196, 255, .32),
                    0 14px 30px rgba(37, 99, 235, .12),
                    inset 0 1px 2px rgba(255, 255, 255, .95);
            }

            .topic-button:not(.disabled):active {
                transform: translateY(-1px) scale(.99);
            }
        }

        .topic-button .soon {
            margin-left: auto;

            font-size: 11px;
            font-weight: 700;

            padding: 5px 8px;

            border-radius: 8px;

            background: rgba(100, 116, 139, 0.12);
            color: #64748b;
        }


        /* =========================
           TRAINING
        ========================= */

        #trainingScreen {
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 0;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            left: 50%;

            transform: translateX(-50%);

            width: min(78vw, 320px);

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            gap: 5px;

            z-index: 10;
        }

        .stat {
            height: 34px;

            padding: 0 6px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            font-size: 10px;
            font-weight: 650;

            white-space: nowrap;

            border: 1px solid rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 7px 18px rgba(30, 100, 200, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.85);
        }

        .stat.correct {
            color: #16803c;
            background: rgba(220, 252, 231, 0.58);
        }

        .stat.wrong {
            color: #dc2626;
            background: rgba(254, 226, 226, 0.58);
        }

        .stat.total {
            color: #64748b;
            background: rgba(241, 245, 249, 0.58);
        }


        /* =========================
           TRAINING TOP
        ========================= */

        .training-top {
            position: relative;

            /* Большая верхняя зона специально отведена под N20.
               Текст может занимать несколько строк по высоте, но
               никогда не пересекается со счётчиками и кнопками. */
            height: 66%;
            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding:
                72px
                20px
                18px;
            box-sizing: border-box;
        }

        .word-area {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;
            min-height: 0;

            text-align: center;
            box-sizing: border-box;
        }

        .word-area.n20-layout {
            position: absolute;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /*
           В N20 результат всегда находится ОТДЕЛЬНО под заданием.
           Он не накладывается на текст: под него заранее резервируется
           собственная высота в fitTaskText().
        */
        .word-area.n20-layout .result {
            position: static;
            flex: 0 0 54px;
            width: 100%;
            height: 54px;
            min-height: 54px;
            margin: 0;
            transform: none;
            box-sizing: border-box;
            justify-content: center;
            overflow: hidden;
        }

        .word {
            font-size: clamp(38px, 11vw, 58px);

            font-weight: 800;

            letter-spacing: -1px;

            color: #111827;

            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word:not(.n20-fit) {
            width: 100%;
            max-width: 100%;
            flex-direction: column;
        }

        .word:not(.n20-fit) .word-main {
            display: inline-block;
            white-space: nowrap;
        }

        .word:not(.n20-fit) .word-switch-new {
            max-width: 100%;
        }

        .word:not(.n20-fit) .word-note {
            max-width: 100%;
            white-space: normal;
            font-size: clamp(14px, 0.42em, 20px);
        }

        .word .missing {
            display: inline-block;

            min-width: 0.6em;

            color: #2563eb;
        }

        .word.n20-fit {
            /* Уже по ширине = больше строк и больше доступной высоты. */
            width: min(76vw, 820px);
            max-width: min(76vw, 820px);
            min-height: 0;
            line-height: 1.08;
            letter-spacing: -0.35px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .word.n20-fit .word-main {
            display: block;
            width: 100%;
            max-width: 100%;
        }


        /* =========================
           RESULT
        ========================= */

        .result {
            margin-top: 12px;

            display: flex;
            flex-direction: column;

            align-items: center;

            min-height: 54px;

            text-align: center;
        }

        .result-label {
            font-size: 12px;
            font-weight: 600;

            color: rgba(17, 24, 39, 0.55);

            line-height: 1.3;
        }

        .result-word {
            margin-top: 3px;

            font-size: 15px;
            font-weight: 700;

            line-height: 1.2;
        }

        .result.correct-result .result-word {
            color: #16803c;
        }

        .result.wrong-result .result-word {
            color: #dc2626;
        }


        /* =========================
           ANSWER AREA
        ========================= */

        .training-bottom {
            height: 34%;
            min-height: 0;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            padding:
                10px
                20px
                calc(env(safe-area-inset-bottom) + 42px);
            box-sizing: border-box;
        }

        .answer-buttons {
            width: min(78vw, 310px);

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 16px;
        }

        .answer-buttons.three-buttons {
            grid-template-columns: repeat(3, 1fr);
        }

        .word-note {
            display: block;
            margin-top: 8px;
            font-size: 0.42em;
            line-height: 1.15;
            font-weight: 500;
            opacity: 0.75;
        }

        .result-word-note {
            display: block;
            margin-top: 4px;
            font-size: 0.72em;
            font-weight: 500;
            opacity: 0.8;
        }

        .answer-button {
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 25px;

            font-size: clamp(36px, 11vw, 58px);
            font-weight: 750;

            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;

            transition:
                transform 0.12s ease,
                background 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .answer-button:active {
            transform: scale(0.94);
        }

        .answer-button.correct-answer {
            background: rgba(187, 247, 208, 0.75);
            border-color: rgba(34, 197, 94, 0.7);

            color: #15803d;

            box-shadow:

                inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

            pointer-events: none;
        }

        .answer-button.n20-number-button,
        .n20-submit-button {
            aspect-ratio: auto;
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 700;
        }

        .answer-button.n20-number-button.selected {
            background: rgba(250, 204, 21, .78);
            border-color: rgba(234, 179, 8, .82);
            color: #92400e;
            box-shadow: 0 8px 22px rgba(234, 179, 8, .18), inset 0 1px 2px rgba(255,255,255,.95);
        }

        .answer-buttons.n20-mode {
            width: min(92vw, 320px);
            grid-template-columns: repeat(5, 48px);
            grid-template-rows: repeat(2, 48px);
            justify-content: center;
            align-items: center;
            gap: 7px;
        }

        .n20-submit-button {
            grid-column: auto;
            grid-row: 2;
            justify-self: center;

            /* Галочка должна быть геометрически по центру кнопки.
               У обычного <button> есть собственные padding/line-height,
               поэтому для N20 задаём центрирование явно. */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            text-align: center;

            background: rgba(255,255,255,.52);
            color: #111827;
            box-shadow: 0 8px 20px rgba(30,100,200,.10), inset 0 1px 2px rgba(255,255,255,.95);
        }


        /* =========================
           ANIMATIONS
        ========================= */

        /* Очень мягкое, почти незаметное переключение слов. */
        .word {
            position: relative;
        }

        .word-switch-old,
        .word-switch-new {
            display: inline-block;
            white-space: nowrap;
            will-change: opacity, filter;
        }

        .word-switch-old {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: wordFadeOut 190ms ease-out forwards;
            pointer-events: none;
        }

        .word-switch-new {
            animation: wordFadeIn 220ms ease-out forwards;
        }

        @keyframes wordFadeOut {
            from {
                opacity: 1;
                filter: blur(0);
            }
            to {
                opacity: 0;
                filter: blur(.35px);
            }
        }

        @keyframes wordFadeIn {
            from {
                opacity: 0;
                filter: blur(.35px);
            }
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .word-switch-old,
            .word-switch-new {
                animation: none;
            }
            .word-switch-old {
                display: none;
            }
        }

.pop {
            animation: pop 0.18s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(0.92);
            }

            70% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }


        /* Короткая тряска экрана при двойном нажатии / сбросе цикла */
        .training-screen.cycle-shake {
            animation: cycleEarthquake 420ms cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes cycleEarthquake {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
            10%  { transform: translate3d(-9px, 2px, 0) rotate(-0.7deg); }
            20%  { transform: translate3d(8px, -2px, 0) rotate(0.7deg); }
            30%  { transform: translate3d(-7px, 1px, 0) rotate(-0.55deg); }
            40%  { transform: translate3d(6px, -1px, 0) rotate(0.5deg); }
            52%  { transform: translate3d(-4px, 1px, 0) rotate(-0.35deg); }
            65%  { transform: translate3d(3px, 0, 0) rotate(0.25deg); }
            80%  { transform: translate3d(-1px, 0, 0) rotate(-0.1deg); }
            100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .training-screen.cycle-shake {
                animation: none;
            }
        }

        /* =========================

        ========================= */

        @media (max-height: 650px) {

                height: 66%;
                padding-top: 68px;
            }

                width: min(65vw, 240px);
                gap: 12px;
            }

            .answer-button {
                border-radius: 20px;
            }
        }

    function getLocalDateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    }

    function shiftLocalDate(dateKey, days) {
        const date = new Date(`${dateKey}T12:00:00`);
        date.setDate(date.getDate() + days);
        return getLocalDateKey(date);
    }

    function loadStreakState() {
        try {
            const raw = localStorage.getItem(STREAK_STORAGE_KEY);
            if (!raw) {
                return { streak: 0, lastCompletedDate: null, completedTopics: {} };
            }

            const parsed = JSON.parse(raw);
            return {
                streak: Number.isFinite(parsed?.streak) ? parsed.streak : 0,
                lastCompletedDate: parsed?.lastCompletedDate || null,
                completedTopics: parsed?.completedTopics && typeof parsed.completedTopics === "object"
                    ? parsed.completedTopics
                    : {}
            };
        } catch (error) {
            return { streak: 0, lastCompletedDate: null, completedTopics: {} };
        }
    }

    function saveStreakState(state) {
        try {
            localStorage.setItem(STREAK_STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
            console.warn("Не удалось сохранить серию:", error);
        }
    }

    function updateStreakFlame() {
        if (!streakFlame) return;

        const state = loadStreakState();
        const today = getLocalDateKey();
        const completedToday = state.completedTopics?.[today] || [];
        const hasAnyTopic = completedToday.length > 0;
        const allTopics = DAILY_TOPIC_KEYS.every(key => completedToday.includes(key));

        streakFlame.classList.remove("is-blue", "is-purple");

        if (allTopics) {
            streakFlame.classList.add("is-purple");
            streakFlame.title = `Серия ${state.streak} • все темы за сегодня выполнены`;
        } else if (hasAnyTopic) {
            streakFlame.classList.add("is-blue");
            streakFlame.title = `Серия ${state.streak} • дневная норма выполнена`;
        } else {
            streakFlame.title = `Серия ${state.streak} • выполни любую тему сегодня`;
        }
    }

    function markTopicCompletedForToday(topicKey) {
        const today = getLocalDateKey();
        const state = loadStreakState();
        const completedToday = Array.isArray(state.completedTopics?.[today])
            ? state.completedTopics[today] : [];

        // Повторное завершение той же темы в тот же день серию не увеличивает.
        if (!completedToday.includes(topicKey)) {
            completedToday.push(topicKey);
        }

        // Первая выполненная тема нового дня формирует новую серию.
        if (state.lastCompletedDate !== today) {
            const yesterday = state.lastCompletedDate
                ? shiftLocalDate(today, -1)
                : null;

            state.streak = state.lastCompletedDate === yesterday
                ? state.streak + 1
                : 1;

            state.lastCompletedDate = today;
        }

        if (!state.completedTopics || typeof state.completedTopics !== "object") {
            state.completedTopics = {};
        }

        state.completedTopics[today] = completedToday;
        saveStreakState(state);
        updateStreakFlame();
    }

    function openStreakModal() {
        if (!streakModal) return;

        const state = loadStreakState();
        const days = Math.max(0, Number.isFinite(state.streak) ? state.streak : 0);
        streakModalNumber.textContent = String(days);
        streakModalDays.textContent = days === 1 ? "день активности" : (days >= 2 && days <= 4 ? "дня активности" : "дней активности");

        streakModal.classList.add("is-open");
        streakModal.setAttribute("aria-hidden", "false");

    function saveProgress() {
        if (!currentTopicKey) {
            return;
        }

        try {
            const state = {
                topic: currentTopicKey,
                correctCount,
                wrongCount,
                currentRoundNumber,
                activeWords: activeWords.map(word => getWordIndex(currentWordSet, word)),
                delayedWords: delayedWords.map(item => ({
                    index: getWordIndex(currentWordSet, item.word),
                    delay: item.delay
                })),
                currentWordIndex: currentWord
                    ? getWordIndex(currentWordSet, currentWord)
                    : -1,
                currentWordWasPreviouslyWrong,
                resumeAfterAnswer,
                taskSchemaVersion: currentTopicKey === "n20" ? 2 : 1
            };

            /*
               Прогресс хранится отдельно для каждой темы.
               Поэтому переход в другую тему больше не затирает
               состояние предыдущей.
            */
            let allProgress = {};
            const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);

            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === "object") {
                        if (parsed.topics && typeof parsed.topics === "object") {
                            allProgress = parsed.topics;
                        } else if (parsed.topic) {
                            // Миграция старого формата, где хранилась только одна тема.
                            allProgress[parsed.topic] = parsed;
                        }
                    }
                } catch (parseError) {
                    console.warn("Не удалось прочитать сохранённый прогресс:", parseError);
                }
            }

            allProgress[currentTopicKey] = state;

            localStorage.setItem(
                PROGRESS_STORAGE_KEY,
                JSON.stringify({
                    version: 2,
                    topics: allProgress
                })
            );
        } catch (error) {
            console.warn("Не удалось сохранить прогресс:", error);
        }
    }

    function loadProgress(topicKey) {
        try {
            const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);

            if (!raw) {
                return null;
            }

            const parsed = JSON.parse(raw);
            let state = null;

            if (
                parsed &&
                parsed.topics &&
                typeof parsed.topics === "object"
            ) {
                state = parsed.topics[topicKey] || null;
            } else if (
                parsed &&
                parsed.topic === topicKey
            ) {
                // Поддержка старого формата одного сохранённого состояния.
                state = parsed;
            }

            if (!state) {
                return null;
            }

            const wordSet = getWordSetForTopic(topicKey);

            // Старые сохранения N20 могли содержать предыдущую структуру
            // задания (before/after). Такое состояние нельзя восстанавливать: 
            // оно ломает отображение новой N20. В этом случае начинаем N20
            // с чистого цикла, используя только актуальные задания.
            if (topicKey === "n20" && state.taskSchemaVersion !== 2) {
                // Старые сохранения N20 относятся к предыдущей структуре
                // задания. Не восстанавливаем их, чтобы они не ломали новую N20.
                return null;
            }

            const restoreWord = index =>
                Number.isInteger(index) &&
                index >= 0 &&
                index < wordSet.length
                    ? wordSet[index]
                    : null;

            const restoredActiveWords =
                Array.isArray(state.activeWords)
                    ? state.activeWords
                        .map(restoreWord)
                        .filter(Boolean)
                    : [];

            const restoredDelayedWords =
                Array.isArray(state.delayedWords)
                    ? state.delayedWords
                        .map(item => ({
                            word: restoreWord(item.index),
                            delay: Number(item.delay)
                        }))
                        .filter(item =>
                            item.word &&
                            Number.isFinite(item.delay)
                        )
                    : [];

            const restoredCurrentWord =
                restoreWord(state.currentWordIndex);

            if (
                restoredActiveWords.length === 0 &&
                restoredDelayedWords.length === 0 &&
                !restoredCurrentWord
            ) {
                return null;
            }

            return {
                wordSet,
                correctCount: Number(state.correctCount) || 0,
                wrongCount: Number(state.wrongCount) || 0,
                currentRoundNumber: Number(state.currentRoundNumber) || 0,
                activeWords: restoredActiveWords,
                delayedWords: restoredDelayedWords,
                currentWord: restoredCurrentWord,
                currentWordWasPreviouslyWrong: Boolean(state.currentWordWasPreviouslyWrong),
                resumeAfterAnswer: Boolean(state.resumeAfterAnswer)
            };
        } catch (error) {
            console.warn("Не удалось загрузить прогресс:", error);
            return null;
        }
    }

    let activeScreen = document.querySelector(".screen.active") || homeScreen;

    function showScreen(screen) {

        if (!screen || screen === activeScreen) {
            return;
        }

        const screens = [
            homeScreen,
            topicsScreen,
            trainingScreen
        ];

        const oldScreen = activeScreen;
        const oldIndex = screens.indexOf(oldScreen);
        const newIndex = screens.indexOf(screen);
        const goingForward = newIndex > oldIndex;

        if (screenTransitionTimer) {
            clearTimeout(screenTransitionTimer);
        }

        document
            .querySelectorAll(".screen")
            .forEach(item => {
                item.classList.remove(
                    "active",
                    "transition-forward",
                    "transition-back",
                    "leaving-forward",
                    "leaving-back"
                );
            });

        // Сначала ставим новый экран в стартовую позицию.
        screen.classList.add(
            goingForward
                ? "transition-forward"
                : "transition-back"
        );

        // Затем одним кадром запускаем плавную spring-анимацию.
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                screen.classList.remove(
                    "transition-forward",
                    "transition-back"
                );
                screen.classList.add("active");

                if (oldScreen) {
                    oldScreen.classList.add(
                        goingForward
                            ? "leaving-forward"
                            : "leaving-back"
                    );
                }
            });
        });

        activeScreen = screen;

        screenTransitionTimer = setTimeout(() => {
            if (oldScreen && oldScreen !== activeScreen) {
                oldScreen.classList.remove(
                    "active",
                    "leaving-forward",
                    "leaving-back"
                );
            }
            screenTransitionTimer = null;
        }, 680);
    }

            trainingScreen.classList.add("cycle-shake");
